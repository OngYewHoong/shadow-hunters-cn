<!DOCTYPE html>
<html lang="zh-CN">
<head>
        <title>暗影猎手</title>
        <meta name="Shadow Hunters" content="width=device-width, initial-scale=1">

        <!-- Global site tag (gtag.js) - Google Analytics -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=UA-138967428-1"></script>
        <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}

        gtag('js', new Date());
        gtag('config', 'UA-138967428-1');
        </script>

        <script src="https://cdn.jsdelivr.net/npm/@widgetbot/crate@3" async="" defer="">
        new Crate({
                server: '774628310822289431',
                channel: '774628311267541023',
                color: '#000'
        })
        </script>

        <style>
        body, html {
                height: 100%;
                margin: 0;
                font-family: Palatino, "Times New Roman", Times;
        }

        .bg {
                background-image: url("/static/gfx/waitRoom.svg");
                height: 100%;
                background-position: center;
                background-repeat: no-repeat;
                background-size: cover;
        }

        .centered {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
        }
        </style>
</head>

<body>
        <div class="bg">
                <div class="centered">

                        <p style="position: absolute; top: 200px; left: -50px">
                                <a href="/rules" class="pull-left">
                                        <img src="/static/gfx/rules.png" width="100">
                                </a>
                        </p>

                        <body>
                                <center>
                                        <div style="color: #FFFFFF; background-color: #000000; opacity: .4; position: absolute; top: 300px; left: -195px; font-size: 12px">
                                                <p class=flashes style="width: 390px; height: 0px">
                                                        <p>点击右下角的 Discord，在我们的 Discord 中寻找游戏。</p>
                                                </p>
                                        </div>
                                </center>

                                <center>
                                        <div style="color: #FFFFFF; background-color: #000000; opacity: .4; position: absolute; top: 365px; left: -195px; font-size: 12px">
                                                <p class=flashes style="width: 390px; height: 0px">
                                                        <p>如果游戏断线，请重新输入玩家名称和房间号以重新加入游戏。</p>
                                                </p>
                                        </div>
                                </center>

                                <center>
                                        <div style="width: 350px; border: 5px solid; padding: 10px; box-shadow: 5px 10px #000000; background-color: #DFDFDF;height: 75px; position: fixed; left: -191px">
                                                <form action="/room" method="POST">
                                                        <center>
                                                                <div>
                                                                        <b style="color: #3f2b6d; font-size: 14px">
                                                                                输入玩家名称和房间号加入游戏！
                                                                        </b>
                                                                </div>

                                                                <div><br /></div>

                                                                <input id="screen-name"
                                                                       style="font-family: Palatino, 'Times New Roman', Times;"
                                                                       type="text"
                                                                       name="username"
                                                                       placeholder="玩家名称"
                                                                       autocomplete="off"/>

                                                                <input id="room-id"
                                                                       style="font-family: Palatino, 'Times New Roman', Times;"
                                                                       type="text"
                                                                       name="room_id"
                                                                       placeholder="房间号"
                                                                       autocomplete="off"/>

                                                                <input id="submit-button"
                                                                       style="font-family: Palatino, 'Times New Roman', Times;"
                                                                       type="submit"
                                                                       value="加入"/>

                                                                <div><br /></div>
                                                        </center>
                                                </form>
                                        </div>
                                </center>

                                <div><br /></div>

                                <center>
                                        <div style="color: #FFFFFF; background-color: #000000; opacity: .3; position: absolute; top: 125px; left: -75px; font-size: 12px">
                                                {% with messages = get_flashed_messages() %}
                                                {% if messages %}
                                                <p class=flashes style="width: 150px; height: 0px">
                                                        {% for message in messages %}
                                                        <p>{{ message }}</p>
                                                        {% endfor %}
                                                </p>
                                                {% endif %}
                                                {% endwith %}
                                        </div>
                                </center>

                        </body>
                </div>
        </div>
</body>
